# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Both, because the build needs both: it compiles to bytecode 21 (Kotlin 1.9 cannot target 25)
    # and runs `test` and `run` on 25, whose javac does not have the `Attr.visitYield` assertion that
    # 21's does. See the comments in app/build.gradle. setup-java exports JAVA_HOME_21_X64 and
    # JAVA_HOME_25_X64, which is where Gradle's toolchain detection finds them - without the 25 here
    # the test task has no launcher to resolve and the build fails rather than quietly using 21.
    # 21 is listed last so it is the JAVA_HOME the daemon itself starts on.
    - name: Set up JDK 25 and 21
      uses: actions/setup-java@v4
      with:
        java-version: |
          25
          21
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build with Gradle
      run: ./gradlew build
    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: app/build/reports
