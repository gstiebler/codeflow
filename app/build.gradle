/*
 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Kotlin application project to get you started.
 * For more details take a look at the 'Building Java & JVM projects' chapter in the Gradle
 * User Manual available at https://docs.gradle.org/8.0/userguide/building_java_projects.html
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    // Apply the org.jetbrains.kotlin.jvm Plugin to add support for Kotlin.
    // 1.9.20 is the first release that knows about JVM target 21, which is the
    // current LTS and therefore the default JDK for most new clones.
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'com.adarshr.test-logger' version '3.2.0'

    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

// The JDK codeflow *runs* on, which is the one whose javac decides the graph - see the comment on
// jvmToolchain below for why that is not the same number as the one it compiles against.
def runtimeJdk = 25

kotlin {
    // codeflow reads the running JDK's javac trees through ToolProvider.getSystemJavaCompiler(),
    // so the JDK is an input to the graph, not just to the build. Left unpinned, whichever JDK
    // Gradle happened to start on decided the output, and CI and a local clone disagreed.
    //
    // This is the *compile* target and stays at 21 because Kotlin 1.9 cannot target 25 - it fails
    // with "Inconsistent JVM-target compatibility". Bytecode 21 runs on 25 unchanged, so the two
    // numbers are free to differ, and what matters for the output is only the one below.
    jvmToolchain(21)
}

dependencies {
    // This dependency is used by the application.
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.4.8'

    // Test-only. The exporter writes JSON by hand like the other two exporters; this is here so
    // the tests parse it with something that did not write it.
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use Kotlin Test test framework
            useKotlinTest('1.9.25')
        }
    }
}

test {
    // On javac 21 this suite passes and real input does not: attributing a `yield` whose type javac
    // never worked out trips an internal assertion in `Attr`, and every root in Fineract's largest
    // module produced nothing at all. javac 25 does not have that bug. What the tests assert has to
    // be what a reader gets, so the suite runs on the same javac the tool is pointed at - every golden
    // is byte-identical across the two, which is what says this is a fix and not a rewrite.
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(runtimeJdk) }

    // Gradle's default test heap is 512m, and `LoweringTest` and `InvariantsTest` each sweep every
    // fixture directory - a javac task per fixture, all live at once. Adding five fixtures was enough
    // to exhaust it, and the failure arrives as the *worker* dying after every test has passed, which
    // reads as infrastructure rather than as anything about the suite.
    maxHeapSize = '2g'

    testLogging {
        // codeflow logs at debug and logback puts it on stderr, so a local run is the tool's own
        // diagnostics interleaved with the test that provoked them, which is most of how a failing
        // fixture gets read. On CI nobody is reading a passing run: it is 20k lines per job, 8.5k of
        // them DEBUG, and the failure you came for is somewhere inside. GitHub Actions sets CI, and
        // the reports are uploaded as an artifact either way.
        showStandardStreams = !System.getenv('CI')
    }
}


application {
    // Define the main class for the application.
    mainClass = 'codeflow.AppKt'
}

// `gradlew run` has to use the same javac as the tests, for the reason given on the test task. The
// installed CLI cannot be pinned from here - its start script takes whatever JAVA_HOME names - so
// that requirement lives in CLAUDE.md instead.
run {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(runtimeJdk) }
}
